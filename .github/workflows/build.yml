# Every push and every pull request, because a gate nobody runs is a convention.
name: build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The same floor global.json sets: any 10.0 SDK. That is a compatibility
      # policy and not a pin, which is the intent — see the note in global.json.
      # Saying it in both places means a disagreement between them shows up as a
      # setup failure rather than a silent roll-forward, which is how 8.0.0 went
      # unnoticed: the file was invalid, dotnet ignored it, and the build used
      # whatever happened to be installed.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Locked: restore fails rather than quietly resolving a different graph
      # than the one committed. Without it a lock file is a record of what
      # happened once, not a constraint on what happens next.
      - run: dotnet restore --locked-mode

      # Warnings are already errors in the project files; -warnaserror is here so
      # that a project added later without the setting is still gated.
      - run: dotnet build --no-restore --configuration Release -warnaserror

      # 100% line AND branch, in Release, which is the stricter of the two:
      # Debug and Release do not count branches the same way, and Release found
      # an unreachable guard that Debug reported as covered. Check Release
      # locally too, or the gate will disagree with you.
      #
      # The discipline is that defensive code no test reaches gets removed, made
      # an invariant, or refactored away, and the tests stand in for what it did
      # — which only holds if something checks.
      #
      # ThresholdType is %2C and not a bare comma: MSBuild reads a comma as a
      # property separator and exits with MSB1006 before running a single test,
      # so the gate meant to enforce all of the above never ran at all.
      - run: >
          dotnet test --no-build --configuration Release
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:Threshold=100
          /p:ThresholdType=line%2Cbranch
          /p:ThresholdStat=total

      # NOT gated: dotnet format --verify-no-changes.
      #
      # It reports 90 WHITESPACE differences, every one of them a hand-aligned
      # continuation line — arguments lined up under the opening bracket, «??»
      # chains lined up under each other. `dotnet format whitespace` normalises
      # those to a fixed indent and no .editorconfig setting permits alignment,
      # so gating on it would mean reflowing the whole codebase away from a
      # deliberate style. The charset, final-newline and import-ordering rules
      # ARE satisfied and are in .editorconfig; this is the one part of the file
      # the tool and the author disagree about.
